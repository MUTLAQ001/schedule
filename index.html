  <script>
    (function () {
      window.QU_isLowEndDevice = function () {
        try {
          var nav = window.navigator || {};
          if (nav.connection && (nav.connection.saveData === true || /(^|-)(2g|slow-2g)$/.test(nav.connection.effectiveType || ''))) return true;
          if (typeof nav.deviceMemory === 'number' && nav.deviceMemory <= 4) return true;
          if (typeof nav.hardwareConcurrency === 'number' && nav.hardwareConcurrency <= 4) return true;
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true;
        } catch (e) { }
        return false;
      };
      try {
        var raw = localStorage.getItem('quScheduleSettings_v20');
        var saved = raw ? JSON.parse(raw) : null;
        var on = (saved && typeof saved.highPerformance === 'boolean') ? saved.highPerformance : false;
        if (on) document.body.classList.add('high-performance');
      } catch (e) { }
    })();
  </script>
